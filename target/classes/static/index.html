<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Árvore AVL - Solicitações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; }
        .card { box-shadow: 0 2px 10px rgba(0,0,0,.06); border: 0; }
        .tree { background: #111827; color: #e5e7eb; padding: 20px; border-radius: 10px; min-height: 240px; white-space: pre; font: 16px Consolas, monospace; overflow: auto; }
        .navbar-brand { font-weight: 700; }
        .toast { --bs-toast-max-width: 380px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Árvore AVL — Solicitações</span>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Nova solicitação</h5>
                    <form id="formCadastro">
                        <div class="mb-3">
                            <label for="numero" class="form-label">Número</label>
                            <input id="numero" type="number" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="solicitante" class="form-label">Solicitante</label>
                            <input id="solicitante" class="form-control" maxlength="120" required>
                        </div>
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea id="descricao" class="form-control" rows="3" maxlength="500" required></textarea>
                        </div>
                        <button class="btn btn-primary w-100">Cadastrar solicitação</button>
                    </form>
                    <hr>
                    <button id="carregarExemplo" class="btn btn-outline-secondary w-100">
                        Carregar dados do exercício
                    </button>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Visualização da AVL</h5>
                        <button id="atualizar" class="btn btn-sm btn-outline-primary">Atualizar</button>
                    </div>
                    <p class="text-muted small mt-2">O valor entre colchetes representa o fator de balanceamento (FB).</p>
                    <pre id="arvore" class="tree">Carregando...</pre>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Solicitações — percurso em ordem</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Solicitante</th>
                            <th>Data de abertura</th>
                            <th>Descrição</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarTitulo" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formEditar">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarTitulo">Alterar solicitação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editarNumero" class="form-label">Número</label>
                        <input id="editarNumero" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="editarData" class="form-label">Data de abertura</label>
                        <input id="editarData" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="editarSolicitante" class="form-label">Solicitante</label>
                        <input id="editarSolicitante" class="form-control" maxlength="120" required>
                    </div>
                    <div class="mb-3">
                        <label for="editarDescricao" class="form-label">Descrição</label>
                        <textarea id="editarDescricao" class="form-control" rows="3" maxlength="500" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toastNotificacao" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="toastTitulo">Sistema AVL</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
        <div class="toast-body" id="toastMensagem"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/solicitacoes';
let solicitacoes = [];

function mostrarToast(titulo, mensagem) {
    document.getElementById('toastTitulo').textContent = titulo;
    document.getElementById('toastMensagem').textContent = mensagem;

    const elemento = document.getElementById('toastNotificacao');
    const toast = bootstrap.Toast.getOrCreateInstance(elemento, { delay: 3000 });
    toast.show();
}

function escapar(texto) {
    return String(texto ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
}

function formatarData(valor) {
    if (!valor) {
        return '—';
    }

    let data;
    if (Array.isArray(valor)) {
        const [ano, mes, dia, hora = 0, minuto = 0] = valor;
        data = new Date(ano, mes - 1, dia, hora, minuto);
    } else {
        data = new Date(valor);
    }

    if (Number.isNaN(data.getTime())) {
        return String(valor);
    }

    const dois = (n) => String(n).padStart(2, '0');
    return `${dois(data.getDate())}/${dois(data.getMonth() + 1)}/${data.getFullYear()} ${dois(data.getHours())}:${dois(data.getMinutes())}`;
}

async function lerJsonSeguro(resposta) {
    try {
        return await resposta.json();
    } catch {
        return { sucesso: false, mensagem: 'Resposta inválida do servidor.' };
    }
}

async function atualizar() {
    try {
        const [listaResp, arvoreResp] = await Promise.all([
            fetch(API),
            fetch(API + '/arvore')
        ]);

        if (!listaResp.ok || !arvoreResp.ok) {
            throw new Error('Falha ao consultar a API.');
        }

        solicitacoes = await listaResp.json();
        const arvore = await arvoreResp.text();

        document.getElementById('arvore').textContent = arvore.trim() || '(árvore vazia)';

        document.getElementById('tabela').innerHTML = solicitacoes.length
            ? solicitacoes.map(s => `
                <tr>
                    <td><strong>${escapar(s.numero)}</strong></td>
                    <td>${escapar(s.solicitante)}</td>
                    <td>${escapar(formatarData(s.dataAbertura))}</td>
                    <td>${escapar(s.descricao)}</td>
                    <td class="text-end text-nowrap">
                        <button class="btn btn-sm btn-outline-primary" data-acao="editar" data-numero="${escapar(s.numero)}">
                            Editar
                        </button>
                        <button class="btn btn-sm btn-outline-danger" data-acao="remover" data-numero="${escapar(s.numero)}">
                            Remover
                        </button>
                    </td>
                </tr>`).join('')
            : '<tr><td colspan="5" class="text-center text-muted">Nenhuma solicitação cadastrada.</td></tr>';
    } catch (erro) {
        mostrarToast('Erro', 'Não foi possível acessar a API. Verifique se o Spring Boot está executando.');
    }
}

async function inserir(numero, solicitante, descricao, silencioso = false) {
    const resposta = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero, solicitante, descricao })
    });

    const dados = await lerJsonSeguro(resposta);

    if (!resposta.ok || dados.sucesso === false) {
        throw new Error(dados.mensagem || 'Não foi possível cadastrar.');
    }

    if (!silencioso) {
        mostrarToast('Sucesso', dados.mensagem || 'Solicitação cadastrada com sucesso.');
    }
}

async function alterar(numero, solicitante, descricao) {
    const resposta = await fetch(API + '/' + numero, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ solicitante, descricao })
    });

    const dados = await lerJsonSeguro(resposta);

    if (!resposta.ok || dados.sucesso === false) {
        throw new Error(dados.mensagem || 'Solicitação não encontrada.');
    }

    return dados;
}

async function remover(numero) {
    try {
        const resposta = await fetch(API + '/' + numero, { method: 'DELETE' });
        const dados = await lerJsonSeguro(resposta);

        if (!resposta.ok || dados.sucesso === false) {
            mostrarToast('Atenção', dados.mensagem || 'Solicitação não encontrada.');
            return;
        }

        mostrarToast('Remoção', dados.mensagem || 'Solicitação removida com sucesso.');
        await atualizar();
    } catch (erro) {
        mostrarToast('Erro', 'Não foi possível comunicar com o servidor.');
    }
}

function abrirEdicao(numero) {
    const solicitacao = solicitacoes.find(item => item.numero === numero);

    if (!solicitacao) {
        mostrarToast('Atenção', 'Solicitação não encontrada.');
        return;
    }

    document.getElementById('editarNumero').value = solicitacao.numero;
    document.getElementById('editarData').value = formatarData(solicitacao.dataAbertura);
    document.getElementById('editarSolicitante').value = solicitacao.solicitante || '';
    document.getElementById('editarDescricao').value = solicitacao.descricao || '';

    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalEditar')).show();
}

document.getElementById('tabela').addEventListener('click', (evento) => {
    const botao = evento.target.closest('button[data-acao]');
    if (!botao) {
        return;
    }

    const numero = Number(botao.dataset.numero);
    if (botao.dataset.acao === 'editar') {
        abrirEdicao(numero);
    } else if (botao.dataset.acao === 'remover') {
        remover(numero);
    }
});

document.getElementById('formCadastro').addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const numero = Number(document.getElementById('numero').value);
    const solicitante = document.getElementById('solicitante').value.trim();
    const descricao = document.getElementById('descricao').value.trim();

    if (!numero) {
        mostrarToast('Atenção', 'Informe o número da solicitação.');
        return;
    }

    if (!solicitante) {
        mostrarToast('Atenção', 'Informe o nome do solicitante.');
        return;
    }

    if (!descricao) {
        mostrarToast('Atenção', 'Informe a descrição da solicitação.');
        return;
    }

    try {
        await inserir(numero, solicitante, descricao);
        evento.target.reset();
        document.getElementById('numero').focus();
        await atualizar();
    } catch (erro) {
        mostrarToast('Erro', erro.message);
    }
});

document.getElementById('formEditar').addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const numero = Number(document.getElementById('editarNumero').value);
    const solicitante = document.getElementById('editarSolicitante').value.trim();
    const descricao = document.getElementById('editarDescricao').value.trim();

    if (!solicitante) {
        mostrarToast('Atenção', 'Informe o nome do solicitante.');
        return;
    }

    if (!descricao) {
        mostrarToast('Atenção', 'Informe a descrição da solicitação.');
        return;
    }

    try {
        const dados = await alterar(numero, solicitante, descricao);
        bootstrap.Modal.getOrCreateInstance(document.getElementById('modalEditar')).hide();
        mostrarToast('Sucesso', dados.mensagem || 'Solicitação alterada com sucesso.');
        await atualizar();
    } catch (erro) {
        mostrarToast('Erro', erro.message);
    }
});

document.getElementById('atualizar').addEventListener('click', atualizar);

document.getElementById('carregarExemplo').addEventListener('click', async () => {
    const dados = [
        [50, 'Paulo Lima', 'Problema no servidor'],
        [30, 'Ana Souza', 'Computador não inicia'],
        [70, 'Carlos Mendes', 'Falha de conexão'],
        [20, 'Juliana Costa', 'Impressora não funciona'],
        [40, 'Rafael Dias', 'Erro no sistema'],
        [60, 'Fernanda Alves', 'Problema de acesso'],
        [80, 'Bruno Martins', 'Troca de equipamento'],
        [10, 'Camila Rocha', 'Instalação de software'],
        [25, 'Diego Nunes', 'Configuração de usuário']
    ];

    let inseridos = 0;

    for (const [numero, solicitante, descricao] of dados) {
        try {
            await inserir(numero, solicitante, descricao, true);
            inseridos++;
        } catch {
            // Registros já existentes são ignorados ao carregar o exemplo.
        }
    }

    if (inseridos > 0) {
        mostrarToast('Exemplo carregado', `${inseridos} solicitação(ões) inserida(s).`);
    } else {
        mostrarToast('Informação', 'Os dados do exercício já estão cadastrados.');
    }

    await atualizar();
});

atualizar();
</script>
</body>
</html>
